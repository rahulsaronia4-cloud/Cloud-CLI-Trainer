<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud & Linux CLI Trainer</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .terminal {
            width: 100%;
            max-width: 750px;
            border: 2px solid #00ff41;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            background-color: #090c10;
        }
        h1 {
            text-align: center;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .task-box {
            background: #161b22;
            padding: 15px;
            border-left: 4px solid #00ff41;
            margin-bottom: 15px;
            font-size: 1.1rem;
            word-break: break-word;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        button {
            background: #00ff41;
            color: #0d1117;
            border: none;
            padding: 12px 18px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #00cc33; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid #1f2937;
            padding: 8px;
            text-align: left;
        }
        th { background-color: #161b22; }
    </style>
</head>
<body>

<div class="terminal">
    <h1>>_ CLOUD & LINUX CLI TRAINER</h1>
    
    <div class="stats">
        <span>Time: <strong id="timer">60</strong>s</span>
        <span>Score: <strong id="score">0</strong></span>
        <span>Commands: <strong id="cmd-count">0</strong></span>
    </div>

    <div class="task-box" id="task-display">
        Press "START SESSION" to begin your DevOps & Cloud CLI drill!
    </div>

    <p id="hint-display" style="color: #8b949e; margin-top: -5px; font-size: 0.95rem;"></p>

    <div class="input-group">
        <input type="text" id="cli-input" placeholder="Type exact command here..." 
               autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" disabled>
        <button id="submit-btn" onclick="checkCommand()" disabled>RUN</button>
    </div>

    <button id="start-btn" onclick="startSession()">START SESSION</button>

    <h3 style="margin-top: 25px;">🏆 TOP SCORES (SQL + EXCEL BACKEND)</h3>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Engineer Name</th>
                <th>Score</th>
                <th>WPM</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
</div>

<script>
    const challenges = [
        { task: "Check current working directory", cmd: "pwd" },
        { task: "List all files including hidden ones", cmd: "ls -la" },
        { task: "Restart Nginx web server service", cmd: "sudo systemctl restart nginx" },
        { task: "List all running Docker containers", cmd: "docker ps" },
        { task: "List all AWS S3 buckets", cmd: "aws s3 ls" },
        { task: "Check Git repository status", cmd: "git status" },
        { task: "View active network connections and ports", cmd: "ss -tulnp" },
        { task: "Check disk space usage in human-readable format", cmd: "df -h" },
        { task: "Pull latest changes from remote Git repo", cmd: "git pull" },
        { task: "Display Linux kernel and system info", cmd: "uname -a" }
    ];

    let currentChallenge = null;
    let score = 0;
    let commandsCompleted = 0;
    let totalChars = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let gameActive = false;

    const inputEl = document.getElementById("cli-input");
    const submitBtn = document.getElementById("submit-btn");
    const taskEl = document.getElementById("task-display");
    const hintEl = document.getElementById("hint-display");

    function startSession() {
        score = 0;
        commandsCompleted = 0;
        totalChars = 0;
        timeLeft = 60;
        gameActive = true;

        document.getElementById("score").innerText = score;
        document.getElementById("cmd-count").innerText = commandsCompleted;
        document.getElementById("timer").innerText = timeLeft;

        inputEl.disabled = false;
        submitBtn.disabled = false;
        inputEl.value = "";
        inputEl.focus();
        nextChallenge();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;
            if (timeLeft <= 0) endSession();
        }, 1000);
    }

    function nextChallenge() {
        currentChallenge = challenges[Math.floor(Math.random() * challenges.length)];
        taskEl.innerText = "Task: " + currentChallenge.task;
        hintEl.innerText = "Command: " + currentChallenge.cmd;
    }

    function checkCommand() {
        if (!gameActive || !currentChallenge) return;
        const typed = inputEl.value.trim().toLowerCase();
        if (typed === currentChallenge.cmd.toLowerCase()) {
            score += 10;
            commandsCompleted++;
            totalChars += currentChallenge.cmd.length;
            document.getElementById("score").innerText = score;
            document.getElementById("cmd-count").innerText = commandsCompleted;
            inputEl.value = "";
            nextChallenge();
        }
    }

    // Mobile aur Desktop dono par Enter/Done ya exact match hote hi turant chalega
    inputEl.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.keyCode === 13) {
            e.preventDefault();
            checkCommand();
        }
    });

    inputEl.addEventListener("input", function() {
        checkCommand();
    });

    function endSession() {
        clearInterval(timerInterval);
        gameActive = false;
        inputEl.disabled = true;
        submitBtn.disabled = true;
        const wpm = Math.round((totalChars / 5) / 1);
        taskEl.innerText = `SESSION COMPLETE! Final Score: ${score}`;
        hintEl.innerText = "";

        setTimeout(() => {
            const playerName = prompt(`Session Over! Score: ${score} | WPM: ${wpm}\nEnter your name for the SQL & Excel Leaderboard:`);
            if (playerName && playerName.trim() !== "") {
                fetch('/save_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: playerName.trim(), score: score, wpm: wpm })
                }).then(() => loadLeaderboard());
            }
        }, 100);
    }

    function loadLeaderboard() {
        fetch('/leaderboard')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("leaderboard-body");
                tbody.innerHTML = "";
                data.forEach((row, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${index + 1}</td>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                        </tr>`;
                });
            });
    }

    loadLeaderboard();
</script>
</body>
</html>
