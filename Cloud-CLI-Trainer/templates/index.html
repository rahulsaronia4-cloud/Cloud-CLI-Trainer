<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud-CLI-Trainer | Multi-Track Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #090d16;
      --panel-bg: #111827;
      --terminal-bg: #05080f;
      --primary: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Topic Tabs */
    .tracks {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .track-btn {
      background: var(--panel-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.65rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Poppins', sans-serif;
    }

    .track-btn:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .track-btn.active {
      background: var(--primary);
      color: #04121e;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    /* Status & Progress Bar */
    .stats-bar {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .progress-wrapper {
      flex: 1;
      min-width: 200px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-dark);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    /* Challenge Card */
    .challenge-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
    }

    .task-number {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--warning);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .task-desc {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .hint-box {
      display: none;
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      padding: 0.65rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #fcd34d;
      margin-top: 0.8rem;
      font-family: 'Fira Code', monospace;
    }

    /* Terminal Window */
    .terminal {
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .terminal-header {
      background: #161f30;
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background: #ef4444; }
    .yellow { background: #f59e0b; }
    .green { background: #22c55e; }

    .terminal-title {
      margin-left: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .terminal-body {
      padding: 1.2rem;
      font-family: 'Fira Code', monospace;
      min-height: 220px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.95rem;
    }

    .log-line {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .log-cmd { color: var(--primary); }
    .log-success { color: var(--success); }
    .log-error { color: var(--error); }
    .log-info { color: var(--text-muted); }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .prompt {
      color: var(--success);
      font-weight: 600;
      white-space: nowrap;
    }

    input[type="text"] {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      width: 100%;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 0.8rem;
    }

    .btn-sm {
      background: var(--panel-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Poppins', sans-serif;
    }

    .btn-sm:hover {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cloud-CLI-Trainer</h1>
      <p>Har track aur har level mein 5 real-world CLI commands practice karein</p>
    </header>

    <!-- Track Selector -->
    <div class="tracks">
      <button class="track-btn active" onclick="switchTrack('linux')">🐧 Linux CLI</button>
      <button class="track-btn" onclick="switchTrack('docker')">🐳 Docker CLI</button>
      <button class="track-btn" onclick="switchTrack('git')">🌿 Git CLI</button>
      <button class="track-btn" onclick="switchTrack('aws')">☁️ AWS CLI</button>
    </div>

    <!-- Stats & Level Progress -->
    <div class="stats-bar">
      <span class="badge" id="level-badge">Level 1: Basics</span>
      <div class="progress-wrapper">
        <div class="progress-label">
          <span>Level Progress</span>
          <span id="progress-text">Command 1 / 5</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <span class="badge" id="score-badge">Score: 0</span>
    </div>

    <!-- Current Task Card -->
    <div class="challenge-card">
      <div class="task-number" id="task-num">TASK 1 OF 5</div>
      <div class="task-desc" id="task-desc">Loading task...</div>
      <div class="hint-box" id="hint-box"></div>
    </div>

    <!-- Interactive Terminal -->
    <div class="terminal" onclick="document.getElementById('cmd-input').focus()">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="terminal-title" id="term-title">rahul@cloud-lab:~/linux$</span>
      </div>
      <div class="terminal-body" id="terminal-output">
        <div class="log-line log-info">Welcome! Type the exact command below and press Enter.</div>
        <div class="input-row">
          <span class="prompt" id="prompt-label">rahul@linux:~$</span>
          <input type="text" id="cmd-input" autocomplete="off" autofocus placeholder="Type command here..." />
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="actions">
      <button class="btn-sm" onclick="toggleHint()">💡 Show Hint</button>
      <button class="btn-sm" onclick="clearTerminal()">🧹 Clear Terminal</button>
    </div>
  </div>

  <script>
    // Har topic ke har level mein exactly 5 commands hain
    const curriculum = {
      linux: {
        prompt: "rahul@linux:~$",
        levels: [
          {
            title: "Level 1: Navigation & Files",
            commands: [
              { desc: "Current working directory ka path check karein", ans: ["pwd"], hint: "Print Working Directory -> pwd", out: "/home/rahul/projects" },
              { desc: "Directory ke andar sabhi files aur folders list karein", ans: ["ls", "ls -la", "ls -l"], hint: "List files -> ls", out: "index.html  app.py  logs/  config.env" },
              { desc: "'cloud-lab' naam ka naya folder banayein", ans: ["mkdir cloud-lab"], hint: "Make directory -> mkdir cloud-lab", out: "Directory 'cloud-lab' created." },
              { desc: "'cloud-lab' directory ke andar move karein", ans: ["cd cloud-lab"], hint: "Change directory -> cd cloud-lab", out: "Moved to /home/rahul/projects/cloud-lab" },
              { desc: "'server.log' naam ki ek empty file banayein", ans: ["touch server.log"], hint: "Create empty file -> touch server.log", out: "File 'server.log' created." }
            ]
          },
          {
            title: "Level 2: Permissions & System",
            commands: [
              { desc: "'deploy.sh' script ko executable permission (+x) dein", ans: ["chmod +x deploy.sh"], hint: "Change mode -> chmod +x deploy.sh", out: "Permissions updated for deploy.sh" },
              { desc: "'app.log' file ke andar 'ERROR' word search karein", ans: ["grep ERROR app.log", "grep \"ERROR\" app.log"], hint: "Search pattern -> grep ERROR app.log", out: "[2026-11-23] ERROR: Connection timeout" },
              { desc: "System mein chal rahi running processes check karein", ans: ["ps aux", "top", "ps"], hint: "Process status -> ps aux", out: "PID   USER     COMMAND\n1042  rahul    python3 app.py" },
              { desc: "Disk space usage human-readable format mein dekhein", ans: ["df -h"], hint: "Disk free -> df -h", out: "Filesystem      Size  Used Avail Use%\n/dev/sda1        50G   18G   32G  36%" },
              { desc: "Currently logged-in username print karein", ans: ["whoami"], hint: "Who am I -> whoami", out: "rahul" }
            ]
          }
        ]
      },
      docker: {
        prompt: "rahul@docker:~$",
        levels: [
          {
            title: "Level 1: Containers & Images",
            commands: [
              { desc: "System par installed Docker version check karein", ans: ["docker --version", "docker -v"], hint: "docker --version", out: "Docker version 27.3.1, build ce12230" },
              { desc: "Docker Hub se 'nginx' image download (pull) karein", ans: ["docker pull nginx"], hint: "docker pull nginx", out: "Using default tag: latest\nStatus: Downloaded newer image for nginx:latest" },
              { desc: "Local system mein maujood sabhi Docker images list karein", ans: ["docker images", "docker image ls"], hint: "docker images", out: "REPOSITORY   TAG       IMAGE ID       SIZE\nnginx        latest    a8758716bb6a   187MB" },
              { desc: "'nginx' container ko detached mode (-d) mein port 8080:80 par run karein", ans: ["docker run -d -p 8080:80 nginx", "docker run -p 8080:80 -d nginx"], hint: "docker run -d -p 8080:80 nginx", out: "8f92c1b4d7e0a123456789abcdef" },
              { desc: "Abhi chal rahe sabhi active containers check karein", ans: ["docker ps"], hint: "docker ps", out: "CONTAINER ID   IMAGE   STATUS         PORTS\n8f92c1b4d7e0   nginx   Up 5 seconds   0.0.0.0:8080->80/tcp" }
            ]
          },
          {
            title: "Level 2: Management & Cleanup",
            commands: [
              { desc: "Stopped containers ko bhi include karke sabhi containers dekhein", ans: ["docker ps -a"], hint: "docker ps -a", out: "Showing all running and exited containers..." },
              { desc: "Current directory ke Dockerfile se 'my-app' image build karein", ans: ["docker build -t my-app ."], hint: "docker build -t my-app .", out: "Successfully built 4e5f6a7b8c9d\nSuccessfully tagged my-app:latest" },
              { desc: "'web-server' container ke logs check karein", ans: ["docker logs web-server"], hint: "docker logs web-server", out: "Server listening on port 80..." },
              { desc: "'web-server' container ko stop karein", ans: ["docker stop web-server"], hint: "docker stop web-server", out: "web-server" },
              { desc: "Stopped 'web-server' container ko remove (delete) karein", ans: ["docker rm web-server"], hint: "docker rm web-server", out: "web-server" }
            ]
          }
        ]
      },
      git: {
        prompt: "rahul@git-repo:~$",
        levels: [
          {
            title: "Level 1: Core Workflow",
            commands: [
              { desc: "Current folder mein nayi Git repository initialize karein", ans: ["git init"], hint: "git init", out: "Initialized empty Git repository in /home/rahul/app/.git/" },
              { desc: "Modified aur untracked files ka status check karein", ans: ["git status"], hint: "git status", out: "On branch main\nUntracked files: index.html" },
              { desc: "Sabhi files ko staging area mein add karein", ans: ["git add .", "git add -A"], hint: "git add .", out: "All changes staged for commit." },
              { desc: "'Initial commit' message ke saath changes commit karein", ans: ["git commit -m \"Initial commit\"", "git commit -m 'Initial commit'"], hint: "git commit -m \"Initial commit\"", out: "[main 7a8b9c1] Initial commit\n 1 file changed, 45 insertions(+)" },
              { desc: "Local commits ko remote 'origin main' branch par push karein", ans: ["git push origin main", "git push -u origin main"], hint: "git push origin main", out: "To https://github.com/rahulsaronia4-cloud/app.git\n * [new branch] main -> main" }
            ]
          }
        ]
      },
      aws: {
        prompt: "rahul@aws-cli:~$",
        levels: [
          {
            title: "Level 1: S3 & IAM Basics",
            commands: [
              { desc: "Current AWS IAM user identity aur account details verify karein", ans: ["aws sts get-caller-identity"], hint: "aws sts get-caller-identity", out: "{\n  \"UserId\": \"AIDAEXAMPLE\",\n  \"Account\": \"123456789012\",\n  \"Arn\": \"arn:aws:iam::123456789012:user/rahul\"\n}" },
              { desc: "Apne account ke sabhi S3 buckets list karein", ans: ["aws s3 ls"], hint: "aws s3 ls", out: "2026-11-20 10:15:00 rahul-cloud-assets-2026" },
              { desc: "'s3://rahul-demo-bucket' naam ka naya S3 bucket banayein", ans: ["aws s3 mb s3://rahul-demo-bucket"], hint: "Make bucket -> aws s3 mb s3://rahul-demo-bucket", out: "make_bucket: rahul-demo-bucket" },
              { desc: "Local 'index.html' file ko 's3://rahul-demo-bucket/' par upload karein", ans: ["aws s3 cp index.html s3://rahul-demo-bucket/"], hint: "Copy file -> aws s3 cp index.html s3://rahul-demo-bucket/", out: "upload: ./index.html to s3://rahul-demo-bucket/index.html" },
              { desc: "Sabhi running EC2 instances ki list describe karein", ans: ["aws ec2 describe-instances"], hint: "aws ec2 describe-instances", out: "{\n  \"Reservations\": []\n}" }
            ]
          }
        ]
      }
    };

    let currentTrack = "linux";
    let levelIdx = 0;
    let cmdIdx = 0;
    let score = 0;

    const inputEl = document.getElementById("cmd-input");
    const outputEl = document.getElementById("terminal-output");

    function switchTrack(track) {
      currentTrack = track;
      levelIdx = 0;
      cmdIdx = 0;

      document.querySelectorAll(".track-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      clearTerminal();
      appendLog(`Switched to ${track.toUpperCase()} track. Complete 5 commands to clear Level 1!`, "log-info");
      updateUI();
    }

    function updateUI() {
      const trackData = curriculum[currentTrack];
      const levelData = trackData.levels[levelIdx];
      const currentCmd = levelData.commands[cmdIdx];

      document.getElementById("level-badge").textContent = levelData.title;
      document.getElementById("progress-text").textContent = `Command ${cmdIdx + 1} / ${levelData.commands.length}`;
      document.getElementById("progress-fill").style.width = `${(cmdIdx / levelData.commands.length) * 100}%`;
      document.getElementById("score-badge").textContent = `Score: ${score}`;

      document.getElementById("task-num").textContent = `TASK ${cmdIdx + 1} OF ${levelData.commands.length}`;
      document.getElementById("task-desc").textContent = currentCmd.desc;
      document.getElementById("hint-box").textContent = `Hint: ${currentCmd.hint}`;
      document.getElementById("hint-box").style.display = "none";

      document.getElementById("term-title").textContent = trackData.prompt;
      document.getElementById("prompt-label").textContent = trackData.prompt;
    }

    function appendLog(text, className) {
      const div = document.createElement("div");
      div.className = `log-line ${className}`;
      div.textContent = text;
      const inputRow = document.querySelector(".input-row");
      outputEl.insertBefore(div, inputRow);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function toggleHint() {
      const hintBox = document.getElementById("hint-box");
      hintBox.style.display = hintBox.style.display === "block" ? "none" : "block";
    }

    function clearTerminal() {
      const inputRow = document.querySelector(".input-row");
      outputEl.innerHTML = "";
      outputEl.appendChild(inputRow);
      inputEl.focus();
    }

    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const userCmd = inputEl.value.trim();
        if (!userCmd) return;

        const trackData = curriculum[currentTrack];
        const levelData = trackData.levels[levelIdx];
        const currentCmd = levelData.commands[cmdIdx];

        appendLog(`${trackData.prompt} ${userCmd}`, "log-cmd");
        inputEl.value = "";

        if (currentCmd.ans.includes(userCmd)) {
          score += 10;
          appendLog(currentCmd.out, "log-success");
          cmdIdx++;

          // Check if 5 commands of current level are completed
          if (cmdIdx >= levelData.commands.length) {
            document.getElementById("progress-fill").style.width = "100%";
            appendLog(`🎉 ${levelData.title} Complete! (+50 Bonus Points)`, "log-success");
            score += 50;

            if (levelIdx + 1 < trackData.levels.length) {
              levelIdx++;
              cmdIdx = 0;
              appendLog(`🔓 Unlocked: ${trackData.levels[levelIdx].title}`, "log-info");
            } else {
              appendLog(`🏆 All available levels in ${currentTrack.toUpperCase()} completed! Restarting Level 1 for practice.`, "log-info");
              levelIdx = 0;
              cmdIdx = 0;
            }
          }
          updateUI();
        } else {
          appendLog(`bash: command mismatch or incorrect syntax. Try again or click 'Show Hint'.`, "log-error");
        }
      }
    });

    // Initialize first view
    updateUI();
  </script>

</body>
</html>
